name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Deploy Docker container to VM
      - name: Deploy Docker container
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # Save the private key
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

          # Copy repo from runner to VM
          scp -i key.pem -o StrictHostKeyChecking=no -r . $VM_USER@$VM_IP:/home/$VM_USER/Downloads/CLASS-TASK2

          # SSH into VM and deploy Docker
          ssh -i key.pem -o StrictHostKeyChecking=no $VM_USER@$VM_IP << EOF
            set -e

            cd /home/$VM_USER/Downloads/CLASS-TASK2

            echo "Stopping any running container..."
            if [ "\$(docker ps -q -f name=class-task2-container)" ]; then
              docker stop class-task2-container
            fi

            echo "Removing any existing container..."
            if [ "\$(docker ps -a -q -f name=class-task2-container)" ]; then
              docker rm class-task2-container
            fi

            echo "Building Docker image..."
            docker build -t class-task2:latest .

            echo "Running Docker container..."
            docker run -d -p 8084:8084 --name class-task2-container class-task2:latest

            echo "Waiting for container to start..."
            sleep 5

            echo "Testing container..."
            if curl -s http://localhost:8084 | grep -q "<html"; then
              echo "✅ Container is serving content."
            else
              echo "❌ Container failed to respond."
              docker logs class-task2-container || true
              exit 1
            fi

            echo "Deployment completed successfully."
          EOF

      # Step 3: Clean up SSH key
      - name: Remove private key
        run: rm -f key.pem
